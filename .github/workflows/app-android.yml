# Arma la app Android del conductor (archivo .apk) cada vez que cambia la carpeta app-android.
# Con la llave de firma (secretos FK_KEYSTORE_B64 / FK_KEYSTORE_PASS): versión oficial en el release "conductor-android".
# Sin llave: versión de prueba en el release "conductor-android-prueba" (no reemplaza la oficial).
name: App Android del conductor
on:
  push:
    paths: ["app-android/**", ".github/workflows/app-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar
        id: build
        env:
          FK_KEYSTORE_B64: ${{ secrets.FK_KEYSTORE_B64 }}
          FK_KEYSTORE_PASS: ${{ secrets.FK_KEYSTORE_PASS }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$FK_KEYSTORE_B64" ]; then
            echo "$FK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flotak.jks"
            FK_KEYSTORE="$RUNNER_TEMP/flotak.jks" ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../flota-k-conductor.apk
            echo "tag=conductor-android" >> "$GITHUB_OUTPUT"
            echo "nombre=App Flota-K Conductor (Android)" >> "$GITHUB_OUTPUT"
            echo "prueba=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin llave de firma: se arma una versión de PRUEBA (no se instala encima de la oficial)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../flota-k-conductor.apk
            echo "tag=conductor-android-prueba" >> "$GITHUB_OUTPUT"
            echo "nombre=App Flota-K Conductor (PRUEBA, sin firma fija)" >> "$GITHUB_OUTPUT"
            echo "prueba=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: ${{ steps.build.outputs.nombre }}
          prerelease: ${{ steps.build.outputs.prueba == 'true' }}
          make_latest: ${{ steps.build.outputs.prueba != 'true' }}
          body: |
            App del conductor de Flota-K para Android. Sigue enviando la ubicación aunque se use Waze, Cabify u otra app.
            Descargue flota-k-conductor.apk desde el teléfono y ábralo para instalar (permita "instalar apps de esta fuente" si el teléfono lo pide).
            Armado ${{ github.run_number }} · ${{ github.sha }}
          files: app-android/flota-k-conductor.apk
