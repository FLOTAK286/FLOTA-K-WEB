<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de reserva | Flota-K</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/">FLOTA<span>·K</span></a><a class="btn small" href="https://wa.me/56922275399" target="_blank" rel="noopener">WhatsApp</a></div></header>
<main class="app">
  <h1>Seguimiento de su reserva</h1>
  <section class="panel" id="calif-panel" hidden></section>
  <section class="panel" id="box"><p class="muted">Cargando…</p></section>
  <section class="panel" id="chat-panel" hidden>
    <h2 style="margin:0">Mensajes con su conductor</h2>
    <p class="muted small" style="margin:0">Para coordinar el encuentro sin compartir números. Su conductor y Flota-K leen estos mensajes.</p>
    <div id="chat"></div>
  </section>
  <p class="muted small">¿Necesita cambiar algo? Escríbanos por WhatsApp al +56 9 2227 5399 indicando su código de reserva.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/assets/mapa.js"></script>
<script src="/assets/chat.js"></script>
<script>
const { sb, esc, fecha, pill, ESTADOS } = FK;
const box = document.getElementById("box");
const ORDEN = ["recibida", "confirmada", "asignada", "en_camino", "en_lugar", "a_bordo", "finalizada"];
const token = new URLSearchParams(location.search).get("t");

const EN_CURSO = ["en_camino", "en_lugar", "a_bordo"];
let estado = null, mapa = null, pin = null, centrado = false, timerUb = null;

async function cargar() {
  if (!token || !/^[0-9a-f-]{36}$/i.test(token)) { box.innerHTML = '<p class="msg err">El enlace de seguimiento no es válido. Revise el enlace que le enviamos.</p>'; return; }
  const { data, error } = await sb.rpc("ver_reserva_publica", { p_token: token });
  if (error || !data || !data.length) { box.innerHTML = '<p class="msg err">No encontramos esta reserva. Revise el enlace o escríbanos por WhatsApp.</p>'; return; }
  const r = data[0];
  const cambio = r.o_estado !== estado; estado = r.o_estado;
  if (!cambio && $("ub-box")) { return; } // mismo estado: solo se refresca la ubicación
  const i = ORDEN.indexOf(r.o_estado);
  const pasos = r.o_estado === "cancelada"
    ? '<p class="msg err">Esta reserva fue cancelada.</p>'
    : '<ol class="steps-track">' + ORDEN.map((e, k) => `<li class="${k < i ? "done" : k === i ? "done now" : ""}">${esc(ESTADOS[e].t)}</li>`).join("") + "</ol>";
  const enCurso = EN_CURSO.includes(r.o_estado);
  mapa = null; pin = null; centrado = false;
  box.innerHTML = `
    <div class="top" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <h2>Reserva ${esc(r.o_codigo)}</h2>${pill(r.o_estado)}
    </div>
    ${enCurso ? `<div id="ub-box"><h3 style="margin:0 0 6px">Ubicación de su conductor</h3><div id="mapa" class="mapa"></div><p class="muted small" id="ub-txt" style="margin-top:6px">Buscando la ubicación del conductor…</p></div>` : ""}
    <dl class="kv">
      <dt>Fecha y hora</dt><dd>${esc(fecha(r.o_fecha_hora))}</dd>
      <dt>Origen</dt><dd>${esc(r.o_origen)}</dd>
      <dt>Destino</dt><dd>${esc(r.o_destino)}</dd>
      <dt>Conductor</dt><dd>${esc(r.o_conductor || "Por asignar")}</dd>
      <dt>Vehículo</dt><dd>${r.o_patente ? `${esc(r.o_vehiculo || "")} · patente <b>${esc(r.o_patente)}</b>` : "Por asignar"}</dd>
    </dl>
    ${pasos}
    <p class="muted small">${enCurso ? "La ubicación se actualiza sola cada 15 segundos." : "Esta página se actualiza sola cada minuto. Cuando su conductor vaya en camino, aquí verá su ubicación en el mapa."}</p>`;
  clearInterval(timerUb);
  if (enCurso) { ubicar(); timerUb = setInterval(ubicar, 15000); }
  conductorAsignado = !!r.o_conductor;
  mensajes();
  if (r.o_estado === "finalizada") calificacion(); else $("calif-panel").hidden = true;
}

// ---- Mensajes con el conductor
let chat = null, chatAbierto = null, conductorAsignado = false;
async function mensajes() {
  const { data, error } = await sb.rpc("ver_mensajes_publico", { p_token: token });
  if (error || !data || !data.length) return;
  const abierto = !!data[0].o_abierto, msgs = data.filter(m => m.o_id).map(m => ({ id: m.o_id, autor: m.o_autor, texto: m.o_texto, creado_en: m.o_creado }));
  if (!abierto && !msgs.length) { $("chat-panel").hidden = true; return; }
  $("chat-panel").hidden = false;
  if (!chat || chatAbierto !== abierto) {
    chatAbierto = abierto;
    chat = FKChat.montar($("chat"), { yo: "pasajero", abierto, placeholder: "Ej.: Estoy en la puerta 3", enviar: async t => {
      const r = await sb.rpc("enviar_mensaje_publico", { p_token: token, p_texto: t }); if (!r.error) mensajes(); return r; } });
  }
  chat.pintar(msgs);
}
setInterval(() => { if (conductorAsignado && !document.hidden) mensajes(); }, 10000);

// ---- Calificación del servicio (una vez finalizado)
let califMostrada = false;
async function calificacion() {
  if (califMostrada) return; califMostrada = true;
  const panel = $("calif-panel"); panel.hidden = false;
  const { data } = await sb.rpc("ver_calificacion_publica", { p_token: token });
  if (data && data.length) { panel.innerHTML = `<h2 style="margin:0">¡Gracias por su calificación!</h2><p style="margin:0">${FKChat.fijas(data[0].o_estrellas)}</p>${data[0].o_comentario ? `<p class="muted" style="margin:0">"${esc(data[0].o_comentario)}"</p>` : ""}`; return; }
  let n = 0;
  panel.innerHTML = `<h2 style="margin:0">¿Cómo estuvo su viaje?</h2><p class="muted small" style="margin:0">Califique a su conductor. Nos ayuda a mejorar.</p>
    <div id="cal-est"></div>
    <textarea id="cal-com" rows="2" maxlength="1000" placeholder="Comentario (opcional)" aria-label="Comentario"></textarea>
    <div class="actions"><button class="btn" id="cal-ok" type="button" disabled>Enviar calificación</button></div><p class="msg err" id="cal-err" hidden></p>`;
  FKChat.estrellas($("cal-est"), v => { n = v; $("cal-ok").disabled = false; });
  $("cal-ok").addEventListener("click", async () => {
    $("cal-ok").disabled = true;
    const { error } = await sb.rpc("calificar_conductor_publico", { p_token: token, p_estrellas: n, p_comentario: $("cal-com").value });
    if (error) { $("cal-err").hidden = false; $("cal-err").textContent = FK.errText(error); $("cal-ok").disabled = false; return; }
    const g = window.FK_CONFIG && window.FK_CONFIG.resenaGoogle;
    panel.innerHTML = `<h2 style="margin:0">¡Gracias por su calificación!</h2><p style="margin:0">${FKChat.fijas(n)}</p>` +
      (n === 5 && g ? `<p style="margin:0">¿Nos ayuda con una reseña en Google? Toma un minuto y ayuda a otros pasajeros a encontrarnos.</p><div class="actions"><a class="btn" href="${esc(g)}" target="_blank" rel="noopener">Dejar reseña en Google</a></div>` : "") +
      (n <= 3 ? `<p class="muted" style="margin:0">Lamentamos que no haya sido una buena experiencia. Revisaremos su comentario y, si quiere, escríbanos por WhatsApp al +56 9 2227 5399.</p>` : "");
  });
}

async function ubicar() {
  const txt = $("ub-txt"); if (!txt) return;
  if (!mapa && window.L) mapa = FKMapa.crear($("mapa"));
  const { data } = await sb.rpc("ver_ubicacion_publica", { p_token: token });
  const u = data && data[0];
  if (!u) { txt.textContent = "Su conductor aún no comparte su ubicación. Apenas lo haga, aparecerá aquí."; return; }
  const viejo = Date.now() - new Date(u.o_actualizado) > 3 * 60e3;
  if (!mapa) { txt.textContent = "No se pudo cargar el mapa. Revise su conexión."; return; }
  if (!pin) pin = L.marker([u.o_lat, u.o_lng], { icon: FKMapa.icono("K", viejo), title: "Su conductor" }).addTo(mapa);
  else { pin.setLatLng([u.o_lat, u.o_lng]); pin.setIcon(FKMapa.icono("K", viejo)); }
  if (!centrado) { mapa.setView([u.o_lat, u.o_lng], 15); centrado = true; }
  txt.textContent = `Última ubicación ${FKMapa.hace(u.o_actualizado)}` + (viejo ? ". El conductor puede estar sin señal o con la app en segundo plano; se actualizará apenas vuelva." : ".");
}
const $ = id => document.getElementById(id);
cargar();
setInterval(cargar, 60000);
</script>
</body>
</html>
